[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wadjet-schema"
version = "0.1.0"
description = "Shared contract between the Wadjet server and the Wadjet agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.5,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.6", "coverage>=7.4"]

[tool.setuptools.packages.find]
include = ["wadjet_schema*"]
