[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wadjet-agent"
version = "0.1.0"
description = "Wadjet analysis agent: runs scanners and uploads findings to the Wadjet server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "wadjet-schema",
    "typer>=0.12,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.5,<3",
]

[project.optional-dependencies]
scanners = [
    "bandit>=1.7.8,<2",
    "pip-audit>=2.7,<3",
    "ruff>=0.6,<1",
    "detect-secrets>=1.4,<2",
    "coverage>=7.4,<8",
]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.6", "coverage>=7.4"]

[project.scripts]
wadjet = "wadjet_agent.cli:main"

[tool.setuptools.packages.find]
include = ["wadjet_agent*"]
