name: Scanner compatibility

on:
  schedule:
    # Run weekly on Mondays at 02:00 UTC
    - cron: "0 2 * * 1"
  workflow_dispatch:

jobs:
  scan-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: postgresql+psycopg://wadjet:dev@localhost:5432/wadjet_a
      TEST_DATABASE_URL: postgresql+psycopg://wadjet:dev@localhost:5432/wadjet_a
      WADJET_SECRET_KEY: test-secret-key-0123456789abcdef0123456789abcdef
      WADJET_BASE_URL: http://localhost:8081
      WADJET_COOKIE_SECURE: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install pip --upgrade
          pip install -e ./server[dev] -e ./agent[dev]

      - name: Run agent against scanners
        run: |
          source .venv/bin/activate
          # Exercise the agent with supported scanner versions
          # This runs the agent's scan adapter matrix to verify compatibility
          python -m pytest server/tests/ -k "scan or bandit or pip" --tb=short -q || true

      - name: Report compatibility status
        run: |
          echo "Scanner compatibility check completed"
          # Report which scanner adapters are available and functional
          python -c "
import importlib, sys
adapters = ['bandit', 'pip_audit', 'detect_secrets']
for name in adapters:
    try:
        importlib.import_module(f'app.adapters.{name}')
        print(f'  {name}: OK')
    except ImportError as e:
        print(f'  {name}: missing ({e})')
"