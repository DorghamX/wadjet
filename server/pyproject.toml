[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wadjet-server"
version = "0.1.0"
description = "Wadjet quality gate server for Python projects"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "wadjet-schema",
    "fastapi>=0.115,<1",
    "sqlalchemy>=2.0.30,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.5,<3",
    "jinja2>=3.1,<4",
    "argon2-cffi>=23.1,<26",
    "markdown-it-py>=3.0,<5",
    "nh3>=0.2.15,<1",
    "python-multipart>=0.0.9,<1",
    "typer>=0.12,<1",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.6", "coverage>=7.4"]

[project.scripts]
wadjet-server = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/**/*", "static/**/*", "kb/*.yml"]
