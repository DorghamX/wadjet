# Enrichment knowledge base for Bandit (section 6).
# One entry per Bandit test ID (bandit 1.9.4 registry, B101..B704).
# Impact text describes consequences for the application, never a restatement
# of the rule. Fix text is actionable and carries a short before/after where
# it makes sense. A test fails if any ID below is missing or empty.

B101:
  title: Assert used
  description: >
    An assert statement was found. Asserts are removed when Python runs with
    optimization (-O), so they never count as validation.
  impact: >
    If the application is ever run with -O, every check written as an assert
    silently disappears: input that should have been rejected flows straight
    into the code behind it, and the guard you thought you had is gone.
  fix: |
    Raise an explicit exception instead of asserting:

    ```python
    # before
    assert user is not None

    # after
    if user is None:
        raise HTTPException(status_code=401, detail="Authentication required")
    ```
  references:
    - https://github.com/PyCQA/bandit/blob/main/bandit/plugins/asserts.py
    - https://cwe.mitre.org/data/definitions/617.html
  cwe: CWE-617

B102:
  title: Exec used
  description: >
    The exec built-in runs a string as Python code. If any part of that string
    comes from outside the program, the caller is handed the interpreter.
  impact: >
    If an attacker can influence the string, they can run arbitrary commands
    on the server with the privileges of the application - read the database,
    open a reverse shell, wipe files.
  fix: |
    Replace exec with an explicit dispatch - a dict of functions or an
    if/elif chain, so no string is ever evaluated as code:

    ```python
    # before
    exec(action + "()")

    # after
    handlers = {"refresh": refresh, "reset": reset}
    handlers[action]()
    ```
  references:
    - https://github.com/PyCQA/bandit/blob/main/bandit/plugins/exec.py
    - https://cwe.mitre.org/data/definitions/94.html
  cwe: CWE-94

B103:
  title: Bad file permissions set
  description: >
    A file or directory is created or changed with permissions wider than
    owner-only access, often via os.chmod or os.makedirs with a permissive
    mode.
  impact: >
    Any local user or process on the host can read - and for world-writable
    files, modify - whatever lands there: configuration, keys, session data,
    uploaded files.
  fix: |
    Keep sensitive paths at 0o600 for files and 0o700 for directories:

    ```python
    # before
    open(path, "w").write(secret)
    os.chmod(path, 0o666)

    # after
    fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
    with os.fdopen(fd, "w") as handle:
        handle.write(secret)
    ```
  references:
    - https://github.com/PyCQA/bandit/blob/main/bandit/plugins/general_bad_file_permissions.py
    - https://cwe.mitre.org/data/definitions/732.html
  cwe: CWE-732

B104:
  title: Hardcoded bind to all interfaces
  description: >
    A server is started on 0.0.0.0 or ::, which accepts connections from
    every network interface, including any the operator did not intend to
    expose.
  impact: >
    The service is reachable from any network the host is attached to. On a
    cloud instance or a developer laptop that means the internet or the local
    LAN can reach a service that was only ever meant for localhost.
  fix: >
    Bind to an explicit address. Use 127.0.0.1 for local-only services and a
    specific interface address when the service must be reached elsewhere;
    let the reverse proxy own the public 0.0.0.0 binding.
  references:
    - https://github.com/PyCQA/bandit/blob/main/bandit/plugins/general_bind_all_interfaces.py
    - https://cwe.mitre.org/data/definitions/668.html
  cwe: CWE-668

B105:
  title: Hardcoded password string
  description: >
    A variable whose name suggests it holds a password is assigned a literal
    value in the source.
  impact: >
    The credential ships in the source code: everyone with repository access
    has it, it lives on in every fork and mirror, and rotating it means a new
    release. Anything the password protects is only as private as the repo.
  fix: >
    Read the password from the environment or a secret manager at startup and
    fail fast when it is missing:
    `password = os.environ["DB_PASSWORD"]` - never a literal.
  references:
    - https://github.com/PyCQA/bandit/blob/main/bandit/plugins/general_hardcoded_password.py
    - https://cwe.mitre.org/data/definitions/798.html
  cwe: CWE-798

B106:
  title: Hardcoded password in function argument
  description: >
    A function argument whose name suggests a password has a literal default
    or is passed a literal at the call site.
  impact: >
    The default value is visible to anyone reading the source and to every
    caller that forgets to override it, so the shared credential quietly
    protects production systems too.
  fix: >
    Make the argument required with no default and pass the value in from the
    environment: `def connect(password: str) -> ...` with callers doing
    `connect(os.environ["DB_PASSWORD"])`.
  references:
    - https://github.com/PyCQA/bandit/blob/main/bandit/plugins/general_hardcoded_password.py
    - https://cwe.mitre.org/data/definitions/798.html
  cwe: CWE-798

B107:
  title: Hardcoded password in default argument
  description: >
    A function defines a literal default value for an argument whose name
    suggests it is a password.
  impact: >
    Anyone who calls the function without the argument silently uses the
    built-in credential, and the literal is readable in the source. The
    fallback becomes the real password in production.
  fix: |
    Use `None` as the default and require a real value:

    ```python
    # before
    def connect(password="hunter2"): ...

    # after
    def connect(password: str | None = None):
        if password is None:
            raise ValueError("password must be provided")
    ```
  references:
    - https://github.com/PyCQA/bandit/blob/main/bandit/plugins/general_hardcoded_password.py
    - https://cwe.mitre.org/data/definitions/798.html
  cwe: CWE-798

B108:
  title: Hardcoded temporary directory
  description: >
    A fixed path under /tmp or another shared temporary directory is used for
    files the application creates or trusts.
  impact: >
    /tmp is shared by every user on the host: another local user can pre-create
    the path, symlink it at something the application trusts, and read or
    replace whatever the application writes there (a classic symlink race).
  fix: |
    Use the tempfile module, which creates a private directory atomically:

    ```python
    # before
    path = "/tmp/myapp-cache"

    # after
    with tempfile.TemporaryDirectory(prefix="myapp-") as path:
        ...
    ```
  references:
    - https://github.com/PyCQA/bandit/blob/main/bandit/plugins/general_hardcoded_tmp.py
    - https://cwe.mitre.org/data/definitions/377.html
  cwe: CWE-377

B110:
  title: Try, except, pass
  description: >
    An except block contains only pass, so the exception is swallowed without
    a trace.
  impact: >
    Failures disappear silently: a permission error, an expired token or a
    corrupt file is ignored and the program continues with half-initialized
    state, making the real fault surface much later as unrelated behaviour.
  fix: |
    Handle the exception or let it propagate; log it if you must continue:

    ```python
    # before
    try:
        cleanup()
    except Exception:
        pass

    # after
    try:
        cleanup()
    except OSError:
        logger.warning("cleanup failed", exc_info=True)
    ```
  references:
    - https://github.com/PyCQA/bandit/blob/main/bandit/plugins/try_except_pass.py
    - https://cwe.mitre.org/data/definitions/755.html
  cwe: CWE-755

B112:
  title: Try, except, continue
  description: >
    An except block contains only continue, so the failing iteration is
    skipped and the loop carries on as if nothing happened.
  impact: >
    Items are silently dropped: one broken record in a batch means missing
    writes or skipped validations, and no error ever reaches the logs or the
    operator.
  fix: >
    Log the failure with the item that failed and decide explicitly whether
    the loop should continue or abort - `logger.exception("skipping record %s", id)`
    keeps the loss observable.
  references:
    - https://github.com/PyCQA/bandit/blob/main/bandit/plugins/try_except_continue.py
    - https://cwe.mitre.org/data/definitions/755.html
  cwe: CWE-755

B113:
  title: Request without timeout
  description: >
    An HTTP request is made without a timeout argument, so the connection or
    the response may take unboundedly long.
  impact: >
    One slow or hostile endpoint ties up a worker forever: request threads
    pile up, the queue grows, and the whole service times out for real users
    while it waits on a server that will never answer.
  fix: |
    Always pass a timeout, and prefer a connect/read pair:

    ```python
    # before
    requests.get(url)

    # after
    requests.get(url, timeout=(3.05, 30))
    ```
  references:
    - https://github.com/PyCQA/bandit/blob/main/bandit/plugins/request_without_timeout.py
    - https://cwe.mitre.org/data/definitions/400.html
  cwe: CWE-400

B201:
  title: Flask debug mode enabled
  description: >
    A Flask application is started with debug=True, which enables the
    interactive debugger and the reloader.
  impact: >
    The Werkzeug debugger exposes an interactive console in the browser on
    unhandled errors - anyone who can trigger an exception gets a Python
    shell on the server and full command execution.
  fix: >
    Never hardcode debug=True. Drive it from configuration that is false in
    production: `app.run(debug=os.environ.get("FLASK_DEBUG") == "1")`, and
    keep the reloader off behind a real WSGI server.
  references:
    - https://github.com/PyCQA/bandit/blob/main/bandit/plugins/app_debug.py
    - https://cwe.mitre.org/data/definitions/489.html
  cwe: CWE-489

B202:
  title: Tarfile unsafe members
  description: >
    A tar archive is extracted without filtering its members, so entries with
    absolute paths or `..` segments are written where the archive says.
  impact: >
    A crafted archive writes files outside the destination - overwriting
    `~/.ssh/authorized_keys`, a cron job, or an application module - which is
    remote code execution reached purely through an upload.
  fix: |
    Filter members before extraction (Python 3.12 has a built-in filter):

    ```python
    # before
    tar.extractall(path=dest)

    # after
    tar.extractall(path=dest, filter="data")
    ```
  references:
    - https://github.com/PyCQA/bandit/blob/main/bandit/plugins/tarfile_unsafe_members.py
    - https://cwe.mitre.org/data/definitions/22.html
  cwe: CWE-22

B301:
  title: Pickle used
  description: >
    pickle.loads, pickle.load or a wrapper such as dill or jsonpickle
    deserializes data. A pickle stream is a program: loading one executes
    whatever instructions it carries.
  impact: >
    If an attacker can supply or modify the bytes - a cache, a cookie, a
    file upload, a message on a queue - loading them runs arbitrary code on
    the server with the application's privileges.
  fix: >
    Do not unpickle untrusted data. Use JSON for data interchange; if you
    need object graphs, use a format without code execution (protobuf,
    msgpack) or sign the payload with HMAC and verify before loading.
  references:
    - https://github.com/PyCQA/bandit/blob/main/bandit/blacklists/calls.py
    - https://cwe.mitre.org/data/definitions/502.html
  cwe: CWE-502

B302:
  title: Marshal used
  description: >
    The marshal module deserializes a byte stream back into Python objects
    and, like pickle, is not safe against manipulated input.
  impact: >
    Crafted marshal data can crash the interpreter or corrupt what the
    program believes it loaded, and the format is version-specific, so
    loading it from users or across Python versions is unbounded trust.
  fix: >
    Use JSON or another data-only format for anything that leaves the
    process. Reserve marshal for Python's own code caching (pyc files).
  references:
    - https://github.com/PyCQA/bandit/blob/main/bandit/blacklists/calls.py
    - https://cwe.mitre.org/data/definitions/502.html
  cwe: CWE-502

B303:
  title: Insecure hash function used
  description: >
    MD2, MD4, MD5 or SHA1 is used for hashing. These hashes are broken:
    collisions can be computed in seconds.
  impact: >
    Where the hash proves integrity or identity - passwords, signatures,
    content addressing, session tokens - an attacker who can craft a
    collision makes malicious data hash the same as trusted data, defeating
    the check.
  fix: |
    Use SHA-256 or better for integrity, and a password KDF for passwords:

    ```python
    # before
    digest = hashlib.md5(payload).hexdigest()

    # after
    digest = hashlib.sha256(payload).hexdigest()
    # passwords:
    pwd_hash = argon2-cffi's hash_password(payload)
    ```
  references:
    - https://github.com/PyCQA/bandit/blob/main/bandit/blacklists/calls.py
    - https://cwe.mitre.org/data/definitions/327.html
  cwe: CWE-327

B304:
  title: Insecure cipher used
  description: >
    A cipher that cryptography considers insecure - such as DES, 3DES or RC4
    - is used for encryption.
  impact: >
    The encryption can be broken with commodity hardware: an attacker who
    captures the traffic recovers the plaintext, so confidentiality of
    anything sent through this cipher is effectively gone.
  fix: >
    Use an authenticated modern cipher - AES-GCM via the cryptography
    library's Fernet or ChaCha20-Poly1305 - and stop at the library's
    defaults rather than choosing a cipher by hand.
  references:
    - https://github.com/PyCQA/bandit/blob/main/bandit/blacklists/calls.py
    - https://cwe.mitre.org/data/definitions/327.html
  cwe: CWE-327

B305:
  title: Insecure cipher mode used
  description: >
    A block cipher mode cryptography marks as insecure - ECB or a bare CBC
    without authentication - is in use.
  impact: >
    ECB leaks structure: identical plaintext blocks encrypt identically, so
    patterns in the data survive the ciphertext, and unauthenticated modes
    let an attacker flip bits in the plaintext by editing the ciphertext.
  fix: >
    Use AES-GCM or another authenticated mode, which encrypts and
    authenticates in one step: `cryptography`'s Fernet is the simplest
    correct choice in Python.
  references:
    - https://github.com/PyCQA/bandit/blob/main/bandit/blacklists/calls.py
    - https://cwe.mitre.org/data/definitions/327.html
  cwe: CWE-327

B306:
  title: Insecure mktemp used
  description: >
    tempfile.mktemp only generates a name; it does not create the file, so
    another process can claim the path between the call and the open.
  impact: >
    A local attacker who wins the race creates the file first - often a
    symlink - and the application then reads or writes an attacker-chosen
    location, leaking secrets or corrupting trusted files.
  fix: |
    Use mkstemp, which creates the file atomically and returns an open
    descriptor:

    ```python
    # before
    path = tempfile.mktemp()
    open(path, "w").write(data)

    # after
    fd, path = tempfile.mkstemp()
    with os.fdopen(fd, "w") as handle:
        handle.write(data)
    ```
  references:
    - https://github.com/PyCQA/bandit/blob/main/bandit/blacklists/calls.py
    - https://cwe.mitre.org/data/definitions/377.html
  cwe: CWE-377

B307:
  title: Eval used
  description: >
    The eval built-in evaluates a string as a Python expression.
  impact: >
    If any part of the string is attacker-controlled, eval executes arbitrary
    code on the server - read the environment, open a shell, modify data -
    with no sandbox between the input and the interpreter.
  fix: |
    Parse instead of evaluating. For literals use ast.literal_eval, for
    structured data use json.loads:

    ```python
    # before
    value = eval(user_input)

    # after
    value = ast.literal_eval(user_input)  # literals only, no calls
    ```
  references:
    - https://github.com/PyCQA/bandit/blob/main/bandit/blacklists/calls.py
    - https://cwe.mitre.org/data/definitions/78.html
  cwe: CWE-78

B308:
  title: Django mark_safe used
  description: >
    mark_safe tells Django's template engine to trust a string as already
    safe HTML, bypassing autoescaping for that value.
  impact: >
    Any HTML the value contains is rendered verbatim: if part of it came
    from a user, that is stored or reflected cross-site scripting -
    session theft, actions performed as the victim.
  fix: |
    Escape the parts that are data and mark only the structure safe:

    ```python
    # before
    return mark_safe("<b>" + user_input + "</b>")

    # after
    return format_html("<b>{}</b>", user_input)
    ```
  references:
    - https://github.com/PyCQA/bandit/blob/main/bandit/blacklists/calls.py
    - https://cwe.mitre.org/data/definitions/79.html
  cwe: CWE-79

B310:
  title: Urllib urlopen with a scheme
  description: >
    urllib.request.urlopen is called with a URL whose scheme is checked, at
    best. file:// and custom schemes let the call read local files or reach
    internal handlers instead of the network.
  impact: >
    If an attacker influences the URL they may read arbitrary local files
    through file:// (application code, keys, /etc/passwd) or trigger
    unexpected protocol handlers, turning a "fetch a URL" feature into local
    file disclosure.
  fix: >
    Parse the URL and allow only http and https for user-supplied hosts, or
    use the requests library with an explicit allowlist of schemes and
    destinations.
  references:
    - https://github.com/PyCQA/bandit/blob/main/bandit/blacklists/calls.py
    - https://cwe.mitre.org/data/definitions/22.html
  cwe: CWE-22

B311:
  title: Random generator used for security
  description: >
    The random module's Mersenne Twister is used where security matters.
    random is deterministic and predictable from its output.
  impact: >
    An attacker who observes a few outputs can reconstruct the internal state
    and predict every future value: session tokens, password reset links and
    CSRF tokens become guessable.
  fix: |
    Use the cryptographically secure secrets module:

    ```python
    # before
    token = "".join(random.choice(ALPHABET) for _ in range(32))

    # after
    token = secrets.token_urlsafe(32)
    ```
  references:
    - https://github.com/PyCQA/bandit/blob/main/bandit/blacklists/calls.py
    - https://cwe.mitre.org/data/definitions/330.html
  cwe: CWE-330

B312:
  title: Telnet function used
  description: >
    A telnetlib function is called. Telnet transmits everything, including
    credentials, in cleartext and offers no integrity protection.
  impact: >
    Anyone on the network path reads the session as it passes: usernames,
    passwords and command output are visible to a passive sniffer, and the
    session can be modified in transit.
  fix: >
    Speak SSH instead - paramiko for programmatic connections - or use an
    API over TLS. There is no safe way to harden telnet itself.
  references:
    - https://github.com/PyCQA/bandit/blob/main/bandit/blacklists/calls.py
    - https://cwe.mitre.org/data/definitions/319.html
  cwe: CWE-319

B313:
  title: Insecure XML parser used (cElementTree)
  description: >
    xml.etree.cElementTree parses XML without defusing external entities, so
    a crafted document can trigger XXE against the process.
  impact: >
    A crafted XML document makes the parser fetch external entities: read
    local files into the parsed result, reach internal HTTP endpoints from
    the server (SSRF), or exhaust memory with entity expansion (billion
    laughs).
  fix: >
    Parse untrusted XML with defusedxml, or build the parser with external
    entity resolution explicitly disabled before handing it untrusted input.
  references:
    - https://github.com/PyCQA/bandit/blob/main/bandit/blacklists/calls.py
    - https://cwe.mitre.org/data/definitions/20.html
  cwe: CWE-20

B314:
  title: Insecure XML parser used (ElementTree)
  description: >
    xml.etree.ElementTree parses XML without defusing external entities, so a
    crafted document can trigger XXE against the process.
  impact: >
    A crafted XML document makes the parser fetch external entities: read
    local files into the parsed result, reach internal HTTP endpoints from
    the server (SSRF), or exhaust memory with entity expansion (billion
    laughs).
  fix: >
    Parse untrusted XML with defusedxml, or build the parser with external
    entity resolution explicitly disabled before handing it untrusted input.
  references:
    - https://github.com/PyCQA/bandit/blob/main/bandit/blacklists/calls.py
    - https://cwe.mitre.org/data/definitions/20.html
  cwe: CWE-20

B315:
  title: Insecure XML parser used (expat reader)
  description: >
    An xmlreader-based parser consumes XML without defusing external
    entities, so a crafted document can trigger XXE against the process.
  impact: >
    A crafted XML document makes the parser fetch external entities: read
    local files into the parsed result, reach internal HTTP endpoints from
    the server (SSRF), or exhaust memory with entity expansion (billion
    laughs).
  fix: >
    Parse untrusted XML with defusedxml, or build the parser with external
    entity resolution explicitly disabled before handing it untrusted input.
  references:
    - https://github.com/PyCQA/bandit/blob/main/bandit/blacklists/calls.py
    - https://cwe.mitre.org/data/definitions/20.html
  cwe: CWE-20

B316:
  title: Insecure XML parser used (expat builder)
  description: >
    xml.dom.minidom's expat builder parses XML without defusing external
    entities, so a crafted document can trigger XXE against the process.
  impact: >
    A crafted XML document makes the parser fetch external entities: read
    local files into the parsed result, reach internal HTTP endpoints from
    the server (SSRF), or exhaust memory with entity expansion (billion
    laughs).
  fix: >
    Parse untrusted XML with defusedxml, or build the parser with external
    entity resolution explicitly disabled before handing it untrusted input.
  references:
    - https://github.com/PyCQA/bandit/blob/main/bandit/blacklists/calls.py
    - https://cwe.mitre.org/data/definitions/20.html
  cwe: CWE-20

B317:
  title: Insecure XML parser used (SAX)
  description: >
    The xml.sax parser processes XML without defusing external entities, so a
    crafted document can trigger XXE against the process.
  impact: >
    A crafted XML document makes the parser fetch external entities: read
    local files into the parsed result, reach internal HTTP endpoints from
    the server (SSRF), or exhaust memory with entity expansion (billion
    laughs).
  fix: >
    Parse untrusted XML with defusedxml, or set
    `feature_external_ges`/`feature_external_pes` to False on the SAX parser
    before parsing untrusted input.
  references:
    - https://github.com/PyCQA/bandit/blob/main/bandit/blacklists/calls.py
    - https://cwe.mitre.org/data/definitions/20.html
  cwe: CWE-20

B318:
  title: Insecure XML parser used (minidom)
  description: >
    xml.dom.minidom parses XML without defusing external entities, so a
