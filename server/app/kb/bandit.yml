  references:
    - https://github.com/PyCQA/bandit/blob/main/bandit/blacklists/calls.py
    - https://cwe.mitre.org/data/definitions/20.html
  cwe: CWE-20

B319:
  title: Insecure XML parser used (pulldom)
  description: >
    xml.dom.pulldom parses XML without defusing external entities, so a
    crafted document can trigger XXE against the process.
  impact: >
